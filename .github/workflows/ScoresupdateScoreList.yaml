name: Update PDF List in Index

on:
  workflow_dispatch: 
  push:
    paths:
      - "Scores/**/*.pdf"

jobs:
  update-index:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Explicitly grants write access for this workflow

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Safely update PDF list in index.html
      run: |
        FILE="index.html"
        TMP_FILE="index.tmp.html"
        NEW_LIST_FILE="new_list.html"
        LIST_START="        <ul id=\"chartList\" class=\"w3-ul\">"
        LIST_END="        </ul>"
        
        addDirContent() {
            local folder="$1"
            local level="$2"
            local indent=$(printf '%*s' "$(((level * 6) + 10))" '')
            echo "${indent}<li>" >> "$NEW_LIST_FILE"
            echo "${indent}  <details>" >> "$NEW_LIST_FILE"
            echo "${indent}    <summary>$(basename "$folder")</summary>" >> "$NEW_LIST_FILE"
            echo "${indent}    <ul class=\"w3-ul\">" >> "$NEW_LIST_FILE"
        
            # Process subfolders first
            find "$folder" -mindepth 1 -maxdepth 1 -type d | sort -f | while read subfolder; do
                addDirContent "$subfolder" $((level + 1))
            done
        
            # Then process files
            find "$folder" -mindepth 1 -maxdepth 1 -type f -name "*.pdf" | sort -f | while read pdf; do
                local filename=$(basename "$pdf" .pdf)
        
                echo "${indent}      <li class=\"res-chart\">" >> "$NEW_LIST_FILE"
                echo "${indent}        <a href=\"$pdf\">$filename</a>" >> "$NEW_LIST_FILE"
                echo "${indent}      </li>" >> "$NEW_LIST_FILE"
            done
        
            echo "${indent}    </ul>" >> "$NEW_LIST_FILE"
            echo "${indent}  </details>" >> "$NEW_LIST_FILE"
            echo "${indent}</li>" >> "$NEW_LIST_FILE"
        }

        # Start new list in separate file
        echo "$LIST_START" > "$NEW_LIST_FILE"

        addDirContent "Scores" 0

        echo "$LIST_END" >> "$NEW_LIST_FILE"

        # Replace everything between the markers
        awk '
        BEGIN {inside_block = 0}
        {
          if ($0 ~ /<!-- BEGIN_CHARTS_LIST -->/) {
            print
            inside_block = 1
        
            while ((getline line < "'"$NEW_LIST_FILE"'") > 0)
              print line
        
            next
          }
        
          if ($0 ~ /<!-- END_CHARTS_LIST -->/) {
            inside_block = 0
            print
            next
          }
        
          if (!inside_block)
            print
        }
        ' "$FILE" > "$TMP_FILE" && mv "$TMP_FILE" "$FILE"

        # Clean up temporary file
        rm "$NEW_LIST_FILE"

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add index.html
        git commit -m "Fix: Stream-based update to avoid large arguments"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
